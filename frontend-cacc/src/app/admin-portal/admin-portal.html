<!-- Admin portal layout: fixed sidebar on the left, content area on the right -->
<div class="admin-layout">

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar">

    <!-- Club logo and current user role -->
    <div class="sidebar-header">
    <img src="/logo-cacc.ico" alt="Club CACC" class="sidebar-logo" />
    <div class="sidebar-brand">
        <span class="brand-name">Club CACC</span>
        <span class="brand-role">Superadmin</span>
    </div>
    </div>

    <!-- Navigation: grouped into sections -->
    <nav class="sidebar-nav">

    <!-- Monitoreo group -->
    <div class="nav-group">
        <span class="nav-group-title">Monitoreo</span>

        <!-- routerLink drives navigation; routerLinkActive highlights the current item -->
        <a class="nav-item" routerLink="/admin/portal/resumen-general" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Resumen General</span>
        </a>

        <a class="nav-item" routerLink="/admin/portal/actividad-movimientos" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
        </svg>
        <span>Actividad y Movimientos</span>
        </a>

        <a class="nav-item" routerLink="/admin/portal/deudas-morosidad" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span>Deudas y Morosidad</span>
        </a>
    </div>

    <!-- Gestión group -->
    <div class="nav-group">
        <span class="nav-group-title">Gestión</span>

        <a class="nav-item" routerLink="/admin/portal/usuarios" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Usuarios y permisos</span>
        </a>

        <a class="nav-item" routerLink="/admin/portal/cuotas-pagos" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
            <line x1="1" y1="10" x2="23" y2="10"></line>
        </svg>
        <span>Cuotas y pagos</span>
        </a>

        <a class="nav-item" routerLink="/admin/portal/reportes" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span>Reportes</span>
        </a>
    </div>
    </nav>

    <!-- Bottom actions: switch portal and log out -->
    <div class="sidebar-footer">
    <button class="nav-item nav-action" (click)="cambiarPortal()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="17 1 21 5 17 9"></polyline>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
        <polyline points="7 23 3 19 7 15"></polyline>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
        </svg>
        <span>Cambiar portal</span>
    </button>

    <button class="nav-item nav-action" (click)="cerrarSesion()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Cerrar sesión</span>
    </button>
    </div>
</aside>

<!-- ===== TOPBAR ===== -->         
<div class="admin-topbar">
    <div class="topbar-breadcrumb">
    <span class="breadcrumb-portal">Portal administrativo</span>
    <span class="breadcrumb-separator">·</span>
    <span class="breadcrumb-current">{{ currentPageTitle }}</span>
    </div>
    <div class="topbar-user">
    <div class="user-info">
        <span class="user-name">{{ userName }}</span>
        <span class="user-email">{{ userEmail }}</span>
    </div>
    <div class="user-avatar">{{ userInitials }}</div>
    </div>
</div>

<!-- ===== CONTENT AREA ===== -->
<!-- Each dashboard renders here through the router -->
<main class="admin-content">
    <router-outlet></router-outlet>
</main>

</div>
