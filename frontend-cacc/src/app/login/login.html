<main class="main">

  <img src="https://lh3.googleusercontent.com/d/1IlnPup9N_pppdqSt8tjgP-O2d-hfboIh" class="img-fluid" alt="Responsive image">

  <div class="login-card">
    <div class="login-header">
      <div class="user-icon">
        <svg xmlns="http://www.w3.org" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#007F3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <h2>Iniciar sesión</h2>
      <p>Accedé al panel de administración</p>
    </div>

    <!-- Enlazamos el formulario reactivo y el evento submit -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <!-- Campo Usuario -->
      <div class="form-group">
        <label for="TituloUsuario">Usuario</label>
        <div class="input-container">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>
          <input type="text" class="form-control" id="TituloUsuario" formControlName="usuario" placeholder="Ingresá tu usuario">
        </div>
        <small *ngIf="loginForm.get('usuario')?.invalid && loginForm.get('usuario')?.touched" class="error" style="color: red; font-size: 12px; margin-top: 4px; display: block;">
          El campo usuario es requerido.
        </small>
      </div>

      <!-- Campo Contraseña -->
      <div class="form-group">
        <label for="TituloContraseña">Contraseña</label>
        <div class="input-container">
          <span class="input-icon">
            <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <!-- type="password" asegura el ocultamiento de caracteres (Requerimiento No Funcional) -->
          <input type="password" class="form-control" id="TituloContraseña" formControlName="password" placeholder="Ingresá tu contraseña">
          <span class="eye-icon">
            <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </span>
        </div>
        <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error" style="color: red; font-size: 12px; margin-top: 4px; display: block;">
          El campo contraseña es requerido.
        </small>
      </div>

      <!-- Mensajes del sistema (Error / Éxito) -->
      <div *ngIf="mensajeError" class="alert-error" style="color: red; margin-bottom: 10px; font-weight: 500;">
        {{ mensajeError }}
      </div>
      <div *ngIf="mensajeExito" class="alert-success" style="color: green; margin-bottom: 10px; font-weight: 500;">
        {{ mensajeExito }}
      </div>

      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1">
        <label class="form-check-label" for="exampleCheck1">Recordarme</label>
      </div>

      <!-- Cambiamos a type="submit" para que dispare la validación de Angular antes de navegar -->
      <button type="submit" class="btn btn-primary">Iniciar sesión</button>
    </form>

    <div class="divider">
      <span></span>
    </div>

    <div class="login-footer">
      <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#007F3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      <a href="#">¿Olvidaste tu contraseña?</a>
    </div>
  </div>
</main>
