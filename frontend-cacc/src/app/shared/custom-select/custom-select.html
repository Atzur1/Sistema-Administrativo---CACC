<div class="cs-root" [class.cs-disabled]="disabled">
    <button type="button" class="cs-trigger" [class.cs-open]="isOpen" [attr.id]="id"
            [attr.aria-expanded]="isOpen" [attr.aria-haspopup]="true"
            [disabled]="disabled" (click)="toggleDropdown()">
        <span class="cs-value" [class.cs-placeholder]="!hasValue">{{ hasValue ? value : placeholder }}</span>
        <svg class="cs-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
    </button>

    @if (isOpen) {
        <ul class="cs-menu" role="listbox">
            @for (option of options; track option) {
                <li class="cs-option" [class.cs-selected]="option === value"
                    role="option" [attr.aria-selected]="option === value"
                    (click)="selectOption(option)">
                    <span>{{ option }}</span>
                    @if (option === value) {
                        <svg class="cs-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    }
                </li>
            }
        </ul>
    }
</div>
