$kind: http-request
description: "Autenticación, caso negativo. Con un usuario existente y una contraseña incorrecta la API debe responder 401 y no incluir ningún token en la respuesta: una contraseña errónea no puede devolver credenciales de acceso."
url: "{{baseUrl}}/api/Auth/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"Usuario\": \"admin@cacc.com\",\r

    \  \"Contrasena\": \"password_incorrecta\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code es 401\", function () {\r

      \    pm.response.to.have.status(401);\r

      });\r

      \r

      pm.test(\"No devuelve token\", function () {\r

      \    pm.expect(pm.response.json()).to.not.have.property(\"token\");\r

      });"
    language: text/javascript
