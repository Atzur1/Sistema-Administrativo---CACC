$kind: http-request
description: "Autenticación. Con credenciales correctas la API debe responder 200 y devolver un token JWT. El script posterior guarda ese token en la variable de entorno authToken, que reutilizan las requests que necesitan una sesión iniciada, así que esta request debe correrse antes que las demás de la colección."
url: "{{baseUrl}}/api/Auth/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"Usuario\": \"admin@cacc.com\",\r

    \  \"Contrasena\": \"admin123\"\r

    }"
scripts:
  - type: afterResponse
    code: "const data = pm.response.json();\r

      pm.environment.set(\"authToken\", data.token);\r

      \r

      pm.test(\"Status code es 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"La respuesta incluye un token\", function () {\r

      \    pm.expect(pm.response.json()).to.have.property(\"token\");\r

      });"
    language: text/javascript
order: 1789148372857
