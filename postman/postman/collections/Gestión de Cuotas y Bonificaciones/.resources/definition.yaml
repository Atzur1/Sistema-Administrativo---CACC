$kind: collection
description: "Pruebas de integración de los endpoints de tesorería.\n\nHU-014: endpoints de bonificaciones de jugadores, usados por la grilla de tesorería y la tabla de Becados y Descuentos. Cubre el caso vigente, los dos criterios de ocultamiento automático (bonificación vencida y dada de baja), el jugador sin bonificación y la validación de id inválido. Requieren los scripts database/V20260912_01__recrear_descuentos_identity.sql y database/seed_descuentos_prueba.sql ya ejecutados en ClubCamionerosPRUEBA.\n\nHU-015 y HU-016: registro del cobro (POST /api/Payments) y consulta de pagos por jugador. Cubre el cobro válido en efectivo y por transferencia, el bloqueo de re-cobro de un período ya abonado, las validaciones de método de pago, referencia, mes, jugador y token, y la consulta del historial del jugador. Requieren los scripts database/V20260913_01__recrear_pagos_identity.sql y database/V20260913_02__agregar_periodo_pagos.sql ya ejecutados, y el login válido de la colección Enrutamiento y Seguridad corrido antes, porque el cobro exige el token guardado en authToken. Las requests de cobro se corren en orden: el cobro en efectivo elige un período al azar y lo guarda en variables de la colección que usan las siguientes.\n\nCada ejecución registra dos cobros reales del jugador 577 en ClubCamionerosPRUEBA, con períodos elegidos al azar entre los años 2000 y 2100 para no chocar con el índice único por jugador y período. Se identifican por tener FK_id_usuario_registro cargado y conviene eliminarlos al terminar.\n\nRequiere la API corriendo en {{baseUrl}}."
