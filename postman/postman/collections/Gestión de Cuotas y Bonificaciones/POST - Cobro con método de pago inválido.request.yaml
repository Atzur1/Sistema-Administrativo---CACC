$kind: http-request
description: "HU-015. Solo se aceptan efectivo y transferencia. Un cobro con otro método (cheque) debe rechazarse con 400."
url: "{{baseUrl}}/api/Payments"
method: POST
headers:
  - key: Authorization
    value: "Bearer {{authToken}}"
body:
  type: json
  content: "{\n    \"playerId\": 577,\n    \"periodYear\": 2026,\n    \"periodMonth\": 1,\n    \"amount\": 85000,\n    \"method\": \"cheque\"\n}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code es 400\", function () {\n    pm.response.to.have.status(400);\n});\n\npm.test(\"Informa los métodos permitidos\", function () {\n    pm.expect(pm.response.text()).to.include(\"efectivo\");\n    pm.expect(pm.response.text()).to.include(\"transferencia\");\n});"
    language: text/javascript
order: 1789148380005
