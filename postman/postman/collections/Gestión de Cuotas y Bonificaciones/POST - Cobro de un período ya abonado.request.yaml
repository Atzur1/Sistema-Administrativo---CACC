$kind: http-request
description: "HU-016, bloqueo de re-cobro. Intenta cobrar al jugador 577 el mismo período que ya se registró en POST - Cobro en efectivo válido, ahora por transferencia. La API debe rechazarlo con 400 y no registrar un segundo cobro. Correr después del cobro en efectivo."
url: "{{baseUrl}}/api/Payments"
method: POST
headers:
  - key: Authorization
    value: "Bearer {{authToken}}"
body:
  type: json
  content: "{\n    \"playerId\": {{cobroPlayerId}},\n    \"periodYear\": {{cobroYear}},\n    \"periodMonth\": {{cobroMonth}},\n    \"amount\": 85000,\n    \"method\": \"transferencia\"\n}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code es 400\", function () {\n    pm.response.to.have.status(400);\n});\n\npm.test(\"Informa que el período ya está abonado\", function () {\n    pm.expect(pm.response.text()).to.include(\"already paid\");\n});"
    language: text/javascript
order: 1789148380003
