$kind: http-request
description: "HU-015 y HU-016. Cobro válido en efectivo del jugador 577. La API debe responder 201 con el id del cobro y la cabecera Location, registrar el método en minúsculas, sin referencia, con el período enviado y con la fecha de cobro y de registro tomadas del servidor. El script previo elige un período al azar y lo guarda en las variables cobroYear y cobroMonth, que usan las requests siguientes. Requiere el token del login válido."
url: "{{baseUrl}}/api/Payments"
method: POST
headers:
  - key: Authorization
    value: "Bearer {{authToken}}"
body:
  type: json
  content: "{\n    \"playerId\": {{cobroPlayerId}},\n    \"periodYear\": {{cobroYear}},\n    \"periodMonth\": {{cobroMonth}},\n    \"amount\": 85000,\n    \"method\": \"efectivo\"\n}"
scripts:
  - type: beforeRequest
    code: "// Random period so repeated runs do not collide with the unique index per player and period\nconst year = 2000 + Math.floor(Math.random() * 101);\nconst month = 1 + Math.floor(Math.random() * 12);\n\npm.collectionVariables.set(\"cobroPlayerId\", 577);\npm.collectionVariables.set(\"cobroYear\", year);\npm.collectionVariables.set(\"cobroMonth\", month);"
    language: text/javascript
  - type: afterResponse
    code: "const data = pm.response.json();\nconst year = pm.collectionVariables.get(\"cobroYear\");\nconst month = String(pm.collectionVariables.get(\"cobroMonth\")).padStart(2, \"0\");\n\npm.test(\"Status code es 201\", function () {\n    pm.response.to.have.status(201);\n});\n\npm.test(\"Devuelve el id del cobro y la cabecera Location\", function () {\n    pm.expect(data.id).to.be.above(0);\n    pm.expect(pm.response.headers.get(\"Location\")).to.eql(\"/api/payments/\" + data.id);\n    pm.collectionVariables.set(\"cobroPaymentId\", data.id);\n});\n\npm.test(\"El cobro queda abonado en efectivo y sin referencia\", function () {\n    pm.expect(data.isPaid).to.be.true;\n    pm.expect(data.method).to.eql(\"efectivo\");\n    pm.expect(data.reference).to.be.null;\n});\n\npm.test(\"Registra el período enviado\", function () {\n    pm.expect(data.period).to.eql(year + \"-\" + month);\n});\n\npm.test(\"Registra la fecha de cobro y la fecha de registro del servidor\", function () {\n    pm.expect(data.paymentDate).to.not.be.null;\n    pm.expect(data.registeredAt).to.not.be.null;\n});"
    language: text/javascript
order: 1789148380001
