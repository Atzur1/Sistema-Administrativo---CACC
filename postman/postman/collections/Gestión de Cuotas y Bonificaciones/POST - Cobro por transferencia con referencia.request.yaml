$kind: http-request
description: "HU-015. Cobro válido por transferencia del jugador 577, en el mes siguiente al del cobro en efectivo. La referencia se envía con espacios al principio y al final: la API debe responder 201 y guardarla sin esos espacios. Correr después de POST - Cobro en efectivo válido."
url: "{{baseUrl}}/api/Payments"
method: POST
headers:
  - key: Authorization
    value: "Bearer {{authToken}}"
body:
  type: json
  content: "{\n    \"playerId\": {{cobroPlayerId}},\n    \"periodYear\": {{cobroYear}},\n    \"periodMonth\": {{cobroTransferMonth}},\n    \"amount\": 90000,\n    \"method\": \"transferencia\",\n    \"reference\": \"  TRX-POSTMAN-0001  \"\n}"
scripts:
  - type: beforeRequest
    code: "// Next month of the same year, so it never matches the cash payment period\nconst month = Number(pm.collectionVariables.get(\"cobroMonth\"));\npm.collectionVariables.set(\"cobroTransferMonth\", (month % 12) + 1);"
    language: text/javascript
  - type: afterResponse
    code: "const data = pm.response.json();\n\npm.test(\"Status code es 201\", function () {\n    pm.response.to.have.status(201);\n});\n\npm.test(\"El método queda registrado como transferencia\", function () {\n    pm.expect(data.method).to.eql(\"transferencia\");\n});\n\npm.test(\"La referencia se guarda sin espacios sobrantes\", function () {\n    pm.expect(data.reference).to.eql(\"TRX-POSTMAN-0001\");\n});"
    language: text/javascript
order: 1789148380002
