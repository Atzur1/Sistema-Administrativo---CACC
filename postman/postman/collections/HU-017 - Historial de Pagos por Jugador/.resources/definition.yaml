$kind: collection
description: "Pruebas de integración de la HU-017, historial y registro de transacciones de pago por jugador (GET /api/Jugadores/{id}/historial-pagos). Cubre la estructura de la respuesta (período, monto total y abonos con monto, método y fecha de cobro), el orden del pago más reciente al más antiguo, la paginación por defecto y personalizada con corrección de valores inválidos, el estado vacío, el jugador inexistente, la ausencia y la invalidez del token, y el carácter de solo lectura del endpoint (PUT, POST y DELETE responden 405).\n\nRequieren la API corriendo en {{baseUrl}} y la base con el script de creación ya ejecutado. Los ids están fijos en las requests: el jugador 3 debe tener al menos un pago abonado (dos o más para que el caso de ordenamiento sea significativo) y el jugador 2 no debe tener ninguno.\n\nAntes de correrla, en el entorno Local se cargan en Current value baseUrl (http://localhost:5118), adminUser y adminPassword (el administrador de prueba). Esos valores no se guardan en el repositorio.\n\nSe corre en orden: la primera request inicia sesión y guarda el token en authToken. Todas las demás son de solo lectura, no registran ni modifican pagos, y se pueden repetir sin limpiar la base."
