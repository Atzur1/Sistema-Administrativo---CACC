$kind: http-request
description: "Paso previo de la HU-017. Inicia sesión con el administrador de prueba y guarda el token en authToken, que usan las demás requests de esta carpeta. La API debe responder 200 con un token."
url: "{{baseUrl}}/api/Auth/login"
method: POST
body:
  type: json
  content: "{\n    \"Usuario\": \"admin@cacc.com\",\n    \"Contrasena\": \"admin123\"\n}"
scripts:
  - type: afterResponse
    code: "const respuesta = pm.response.json();\npm.environment.set(\"authToken\", respuesta.token);\n\npm.test(\"Status code es 200\", function () {\n    pm.response.to.have.status(200);\n});\n\npm.test(\"La respuesta incluye un token\", function () {\n    pm.expect(respuesta).to.have.property(\"token\").that.is.a(\"string\").and.not.empty;\n});"
    language: text/javascript
order: 1789148390001
