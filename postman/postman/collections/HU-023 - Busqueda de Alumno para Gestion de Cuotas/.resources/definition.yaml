$kind: collection
description: "Pruebas de integración de la HU-023, búsqueda de alumnos por DNI o apellido en el panel de Cuotas (GET /api/Players/search?term=). Cubre la búsqueda por apellido parcial sin distinguir mayúsculas ni tildes, por DNI completo, parcial y con puntos, el resultado vacío, los comodines de LIKE y una inyección SQL tratados como texto, el tope de 50 resultados, la forma del DTO (id, firstName, lastName, dni, categoryName), la validación del término (mínimo 2 y máximo 50 caracteres), la ausencia y la invalidez del token y el tiempo de respuesta menor a 2 segundos.\n\nRequieren la API corriendo en {{baseUrl}} y al menos un jugador cargado. Antes de correrla, en el entorno Local se cargan en Current value baseUrl, adminUser y adminPassword (el administrador de prueba). Esos valores no se guardan en el repositorio.\n\nSe corre en orden: la primera request inicia sesión y guarda el token en authToken; la segunda toma un jugador real del padrón (GET /api/Jugadores) y guarda hu023Id, hu023Apellido y hu023Dni, que usan las búsquedas siguientes. Todas son de solo lectura y se pueden repetir sin limpiar la base."
