$kind: http-request
description: "HU-023. Busca con las primeras letras del apellido en minúsculas y sin tildes (ej. \"baza\" para BAZÁN). Debe encontrar al jugador: la búsqueda no distingue mayúsculas ni tildes."
url: "{{baseUrl}}/api/Players/search?term={{hu023Parcial}}"
method: GET
headers:
  - key: Authorization
    value: "Bearer {{authToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const apellido = pm.environment.get("hu023Apellido") || "";
      const sinTildes = apellido.normalize("NFD").replace(/[\u0300-\u0302\u0304-\u036f]/g, "").normalize("NFC").toLowerCase();
      pm.environment.set("hu023Parcial", sinTildes.slice(0, 4));

      const dni = pm.environment.get("hu023Dni") || "";
      pm.environment.set("hu023DniParcial", dni.slice(-4));
      pm.environment.set("hu023DniConPuntos", dni.replace(/\B(?=(\d{3})+(?!\d))/g, "."));
    language: text/javascript
  - type: afterResponse
    code: |-
      const respuesta = pm.response.json();

      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Encuentra al jugador buscado", function () {
          pm.expect(respuesta.map(j => j.id)).to.include(Number(pm.environment.get("hu023Id")));
      });

      pm.test("Todos los resultados contienen el término en el apellido", function () {
          const termino = pm.environment.get("hu023Parcial");
          const sinTildes = t => t.normalize("NFD").replace(/[\u0300-\u0302\u0304-\u036f]/g, "").normalize("NFC").toLowerCase();
          respuesta.forEach(j => pm.expect(sinTildes(j.lastName)).to.include(termino));
      });

      pm.test("Responde en menos de 2 segundos", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
    language: text/javascript
order: 1791327600003
