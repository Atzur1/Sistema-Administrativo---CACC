$kind: http-request
description: "HU-023. Un término que no coincide con nadie devuelve 200 con una lista vacía (el front muestra \"No se encontraron alumnos con ese criterio de búsqueda\")."
url: "{{baseUrl}}/api/Players/search?term=zzqxwzzqxw"
method: GET
headers:
  - key: Authorization
    value: "Bearer {{authToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const apellido = pm.environment.get("hu023Apellido") || "";
      const sinTildes = apellido.normalize("NFD").replace(/[\u0300-\u0302\u0304-\u036f]/g, "").normalize("NFC").toLowerCase();
      pm.environment.set("hu023Parcial", sinTildes.slice(0, 4));

      const dni = pm.environment.get("hu023Dni") || "";
      pm.environment.set("hu023DniParcial", dni.slice(-4));
      pm.environment.set("hu023DniConPuntos", dni.replace(/\B(?=(\d{3})+(?!\d))/g, "."));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Devuelve una lista vacía", function () {
          pm.expect(pm.response.json()).to.be.an("array").that.is.empty;
      });
    language: text/javascript
order: 1791327600008
