$kind: http-request
description: "HU-023. La búsqueda requiere sesión iniciada: sin Authorization responde 401 y no devuelve datos de jugadores."
url: "{{baseUrl}}/api/Players/search?term={{hu023Parcial}}"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      const apellido = pm.environment.get("hu023Apellido") || "";
      const sinTildes = apellido.normalize("NFD").replace(/[\u0300-\u0302\u0304-\u036f]/g, "").normalize("NFC").toLowerCase();
      pm.environment.set("hu023Parcial", sinTildes.slice(0, 4));

      const dni = pm.environment.get("hu023Dni") || "";
      pm.environment.set("hu023DniParcial", dni.slice(-4));
      pm.environment.set("hu023DniConPuntos", dni.replace(/\B(?=(\d{3})+(?!\d))/g, "."));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code es 401", function () {
          pm.response.to.have.status(401);
      });

      pm.test("No devuelve datos de jugadores", function () {
          pm.expect(pm.response.text()).to.not.include("lastName");
      });
    language: text/javascript
order: 1791327600014
