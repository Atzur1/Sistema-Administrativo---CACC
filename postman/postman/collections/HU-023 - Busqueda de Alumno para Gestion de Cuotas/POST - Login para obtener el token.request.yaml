$kind: http-request
description: "Paso previo de la HU-023. Inicia sesión con el administrador de prueba y guarda el token en authToken. El usuario y la contraseña salen de adminUser y adminPassword del entorno Local (solo en Current value)."
url: "{{baseUrl}}/api/Auth/login"
method: POST
body:
  type: json
  content: "{\n    \"Usuario\": \"{{adminUser}}\",\n    \"Contrasena\": \"{{adminPassword}}\"\n}"
scripts:
  - type: afterResponse
    code: |-
      const respuesta = pm.response.json();
      pm.environment.set("authToken", respuesta.token);

      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("La respuesta incluye un token", function () {
          pm.expect(respuesta).to.have.property("token").that.is.a("string").and.not.empty;
      });
    language: text/javascript
order: 1791327600001
