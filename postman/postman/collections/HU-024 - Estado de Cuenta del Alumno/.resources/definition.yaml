$kind: collection
description: "Pruebas de integración de la HU-024, estado de cuenta del alumno (GET /api/Pagos/jugador/{id}/estado-de-cuenta). Cubre la forma del PlayerStatementDto y de cada FeeItemDto, los estados Pagado, Pendiente y Vencido, el orden cronológico, el vencimiento al último día del mes, el total a abonar (saldo de las cuotas Pendientes y Vencidas), que solo incluye cuotas mensuales (la inscripción se abona por separado), la coherencia con GET /api/Pagos/cuotas/{id} que usa el cobro (HU-025), el jugador inexistente (404), la ausencia y la invalidez del token y el tiempo de respuesta menor a 2 segundos.\n\nRequieren la API corriendo en {{baseUrl}} y al menos un jugador cargado; los casos de estados y totales tienen sentido con un jugador que tenga cuotas emitidas. Antes de correrla, en el entorno Local se cargan en Current value baseUrl, adminUser y adminPassword. Esos valores no se guardan en el repositorio.\n\nSe corre en orden: la primera request inicia sesión y guarda authToken; la segunda toma el primer jugador del padrón y guarda hu024Id. Para probar otro jugador, cambiar hu024Id en el entorno. Todas son de solo lectura."
