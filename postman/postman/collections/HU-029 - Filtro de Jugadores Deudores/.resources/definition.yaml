$kind: collection
description: "Pruebas de integración de la HU-029, filtro rápido de Jugadores Deudores, pantalla Ver todos los deudores de Deudas y Morosidad (GET /api/Pagos/player-accounts?onlyDebtors=). Cubre el padrón completo, el filtro de deudores (solo jugadores con saldo mayor a cero, ordenados del mayor al menor monto adeudado), la exactitud de los montos contra el detalle de deuda de cada jugador, la coherencia con el indicador Deuda Global Total de la HU-019 y con la Lista de deudores de Deudas y Morosidad (HU-020), el valor inválido del filtro, la ausencia y la invalidez del token, y el carácter de solo lectura del endpoint (POST, PUT y DELETE responden 405).\n\nRequieren la API corriendo en {{baseUrl}} y la base con el script de creación ya ejecutado. Los casos que comparan cifras necesitan al menos un jugador con una cuota pendiente con saldo real mayor a cero (una cuota que un beneficio de Becados y Descuentos dejó en $0 no es deuda). El estado vacío (sin deudores) depende de los datos y se cubre con las pruebas unitarias del front.\n\nSe corre en orden: la primera request inicia sesión y guarda el token en authToken, y las siguientes guardan en el entorno las cifras que comparan (hu029Padron, hu029Deudores, hu029MontoDeudores, hu029PrimerDeudorId y hu029PrimerDeudorMonto). Todas son de solo lectura: no registran ni modifican pagos y se pueden repetir sin limpiar la base."
