$kind: http-request
description: "HU-029 y HU-019. La suma de lo adeudado por los jugadores del filtro debe ser igual a la Deuda Global Total del resumen de pagos, y la cantidad de deudores igual a los jugadores morosos que informa ese resumen, porque ambos usan la misma regla de saldo real (con el beneficio de Becados y Descuentos aplicado). Depende de la request del filtro de deudores, que deja hu029Deudores y hu029MontoDeudores en el entorno."
url: "{{baseUrl}}/api/Pagos/resumen"
method: GET
headers:
  - key: Authorization
    value: "Bearer {{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      const respuesta = pm.response.json();

      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("La cantidad de deudores es igual a los jugadores morosos del resumen", function () {
          pm.expect(Number(pm.environment.get("hu029Deudores"))).to.equal(respuesta.jugadoresMorosos);
      });

      pm.test("La suma adeudada es igual a la Deuda Global Total, al centavo", function () {
          const suma = Number(pm.environment.get("hu029MontoDeudores"));
          pm.expect(Math.round(suma * 100)).to.equal(Math.round(respuesta.deudaGlobalTotal * 100));
      });
    language: text/javascript
order: 1789148400005
