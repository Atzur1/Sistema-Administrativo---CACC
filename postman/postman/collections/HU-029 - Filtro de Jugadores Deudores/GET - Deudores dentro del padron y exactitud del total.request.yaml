$kind: http-request
description: "HU-029, criterio de la definición de listo sobre la exactitud de la consulta. Con onlyDebtors=false explícito la API debe devolver el mismo padrón que sin parámetro, y los jugadores con monto adeudado mayor a cero deben ser exactamente los que devolvió el filtro de deudores, con la misma suma. Depende de las requests anteriores, que dejan hu029Padron, hu029Deudores y hu029MontoDeudores en el entorno."
url: "{{baseUrl}}/api/Pagos/player-accounts?onlyDebtors=false"
method: GET
headers:
  - key: Authorization
    value: "Bearer {{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      const respuesta = pm.response.json();
      const conDeuda = respuesta.filter((jugador) => jugador.amountOwed > 0);
      const suma = conDeuda.reduce((acumulado, jugador) => acumulado + jugador.amountOwed, 0);

      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("El padrón tiene la misma cantidad de jugadores que sin parámetro", function () {
          pm.expect(respuesta.length).to.equal(Number(pm.environment.get("hu029Padron")));
      });

      pm.test("Los jugadores con deuda son los mismos que devuelve el filtro de deudores", function () {
          pm.expect(conDeuda.length).to.equal(Number(pm.environment.get("hu029Deudores")));
      });

      pm.test("La suma adeudada coincide con la del filtro de deudores, al centavo", function () {
          const esperado = Number(pm.environment.get("hu029MontoDeudores"));
          pm.expect(Math.round(suma * 100)).to.equal(Math.round(esperado * 100));
      });
    language: text/javascript
order: 1789148400004
