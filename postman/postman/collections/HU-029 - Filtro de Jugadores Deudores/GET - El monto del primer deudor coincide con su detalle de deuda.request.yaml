$kind: http-request
description: "HU-029, prueba de exactitud de los montos. El monto adeudado del primer deudor del filtro debe ser igual a la suma de los saldos pendientes de su detalle de deuda (GET /api/Pagos/deuda/{idJugador}), la misma cifra que ve el administrador en Deuda Pendiente. Depende de la request del filtro de deudores, que deja hu029PrimerDeudorId y hu029PrimerDeudorMonto en el entorno."
url: "{{baseUrl}}/api/Pagos/deuda/{{hu029PrimerDeudorId}}"
method: GET
headers:
  - key: Authorization
    value: "Bearer {{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      const respuesta = pm.response.json();

      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("El detalle tiene al menos una cuota pendiente", function () {
          pm.expect(respuesta).to.be.an("array").and.not.empty;
      });

      pm.test("La suma de los saldos pendientes es igual al monto adeudado del filtro, al centavo", function () {
          const suma = respuesta.reduce((acumulado, cuota) => acumulado + cuota.saldoPendiente, 0);
          const esperado = Number(pm.environment.get("hu029PrimerDeudorMonto"));
          pm.expect(Math.round(suma * 100)).to.equal(Math.round(esperado * 100));
      });
    language: text/javascript
order: 1789148400006
