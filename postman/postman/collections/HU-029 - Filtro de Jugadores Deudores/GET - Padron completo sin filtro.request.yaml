$kind: http-request
description: "HU-029. Sin activar el filtro, la API debe devolver el padrón completo: un renglón por jugador con nombre, apellido, DNI, categoría, monto adeudado y cantidad de cuotas con saldo. Los jugadores al día figuran con monto adeudado 0. Guarda en el entorno la cantidad de jugadores del padrón (hu029Padron)."
url: "{{baseUrl}}/api/Pagos/player-accounts"
method: GET
headers:
  - key: Authorization
    value: "Bearer {{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      const respuesta = pm.response.json();
      pm.environment.set("hu029Padron", respuesta.length);

      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("La respuesta es una lista con al menos un jugador", function () {
          pm.expect(respuesta).to.be.an("array").and.not.empty;
      });

      pm.test("Cada renglón trae los datos que necesita la cobranza", function () {
          respuesta.forEach((jugador) => {
              pm.expect(jugador.playerId).to.be.a("number").and.above(0);
              pm.expect(jugador.firstName).to.be.a("string").and.not.empty;
              pm.expect(jugador.lastName).to.be.a("string").and.not.empty;
              pm.expect(jugador.dni).to.be.a("string").and.not.empty;
              pm.expect(jugador.category).to.be.a("string").and.not.empty;
              pm.expect(jugador.amountOwed).to.be.a("number");
              pm.expect(jugador.pendingInstallments).to.be.a("number");
          });
      });

      pm.test("Ningún monto adeudado es negativo", function () {
          respuesta.forEach((jugador) => {
              pm.expect(jugador.amountOwed).to.be.at.least(0);
          });
      });

      pm.test("Un jugador al día figura con monto 0 y sin cuotas con saldo", function () {
          respuesta.filter((jugador) => jugador.amountOwed === 0).forEach((jugador) => {
              pm.expect(jugador.pendingInstallments).to.equal(0);
          });
      });

      pm.test("No hay jugadores repetidos", function () {
          const ids = respuesta.map((jugador) => jugador.playerId);
          pm.expect(new Set(ids).size).to.equal(ids.length);
      });

      pm.test("La respuesta no expone datos internos del pago", function () {
          const texto = pm.response.text();
          pm.expect(texto).to.not.include("metodoPago");
          pm.expect(texto).to.not.include("montoBase");
      });
    language: text/javascript
order: 1789148400002
