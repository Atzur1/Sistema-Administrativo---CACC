$kind: http-request
description: "HU-029. El listado de deudores requiere una sesión iniciada. Sin la cabecera Authorization la API debe responder 401 y no devolver datos de jugadores."
url: "{{baseUrl}}/api/Pagos/player-accounts?onlyDebtors=true"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 401", function () {
          pm.response.to.have.status(401);
      });

      pm.test("No devuelve datos de jugadores", function () {
          pm.expect(pm.response.text()).to.not.include("amountOwed");
      });
    language: text/javascript
order: 1789148400007
