$kind: http-request
description: "HU-029, criterio de aceptación de ejecución del filtro. Con onlyDebtors=true la API debe devolver únicamente jugadores con monto adeudado mayor a cero y al menos una cuota con saldo, ordenados del mayor al menor monto adeudado. Requiere al menos un deudor en la base. Guarda en el entorno la cantidad de deudores (hu029Deudores), la suma adeudada (hu029MontoDeudores) y el primer deudor con su monto (hu029PrimerDeudorId y hu029PrimerDeudorMonto)."
url: "{{baseUrl}}/api/Pagos/player-accounts?onlyDebtors=true"
method: GET
headers:
  - key: Authorization
    value: "Bearer {{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      const respuesta = pm.response.json();
      const suma = respuesta.reduce((acumulado, jugador) => acumulado + jugador.amountOwed, 0);

      pm.environment.set("hu029Deudores", respuesta.length);
      pm.environment.set("hu029MontoDeudores", Math.round(suma * 100) / 100);
      if (respuesta.length > 0) {
          pm.environment.set("hu029PrimerDeudorId", respuesta[0].playerId);
          pm.environment.set("hu029PrimerDeudorMonto", respuesta[0].amountOwed);
      }

      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Hay al menos un deudor en la base", function () {
          pm.expect(respuesta).to.be.an("array").and.not.empty;
      });

      pm.test("Todos los renglones tienen saldo mayor a cero y al menos una cuota", function () {
          respuesta.forEach((jugador) => {
              pm.expect(jugador.amountOwed).to.be.above(0);
              pm.expect(jugador.pendingInstallments).to.be.at.least(1);
          });
      });

      pm.test("Cada renglón trae nombre, apellido, DNI, categoría y monto adeudado", function () {
          respuesta.forEach((jugador) => {
              pm.expect(jugador.firstName).to.be.a("string").and.not.empty;
              pm.expect(jugador.lastName).to.be.a("string").and.not.empty;
              pm.expect(jugador.dni).to.be.a("string").and.not.empty;
              pm.expect(jugador.category).to.be.a("string").and.not.empty;
              pm.expect(jugador.amountOwed).to.be.a("number");
          });
      });

      pm.test("Ordenados del mayor al menor monto adeudado", function () {
          for (let i = 1; i < respuesta.length; i++) {
              pm.expect(respuesta[i - 1].amountOwed).to.be.at.least(respuesta[i].amountOwed);
          }
      });

      pm.test("No hay jugadores repetidos", function () {
          const ids = respuesta.map((jugador) => jugador.playerId);
          pm.expect(new Set(ids).size).to.equal(ids.length);
      });

      pm.test("Los deudores son menos o iguales que el padrón completo", function () {
          const padron = Number(pm.environment.get("hu029Padron"));
          pm.expect(respuesta.length).to.be.at.most(padron);
      });
    language: text/javascript
order: 1789148400003
