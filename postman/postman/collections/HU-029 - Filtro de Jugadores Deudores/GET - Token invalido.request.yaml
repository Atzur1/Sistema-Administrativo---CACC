$kind: http-request
description: "HU-029. Un token inválido o alterado no da acceso al listado de deudores: la API debe responder 401 y no devolver datos de jugadores."
url: "{{baseUrl}}/api/Pagos/player-accounts?onlyDebtors=true"
method: GET
headers:
  - key: Authorization
    value: "Bearer token.invalido.hu029"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 401", function () {
          pm.response.to.have.status(401);
      });

      pm.test("No devuelve datos de jugadores", function () {
          pm.expect(pm.response.text()).to.not.include("amountOwed");
      });
    language: text/javascript
order: 1789148400008
