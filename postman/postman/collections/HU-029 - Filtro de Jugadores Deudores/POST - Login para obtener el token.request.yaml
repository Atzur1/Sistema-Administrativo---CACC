$kind: http-request
description: "Paso previo de la HU-029. Inicia sesión con el administrador de prueba y guarda el token en authToken, que usan las demás requests de esta carpeta. El usuario y la contraseña salen de las variables adminUser y adminPassword del entorno Local, que se cargan solo en Current value para que no queden guardadas en el repositorio. La API debe responder 200 con un token."
url: "{{baseUrl}}/api/Auth/login"
method: POST
body:
  type: json
  content: "{\n    \"Usuario\": \"{{adminUser}}\",\n    \"Contrasena\": \"{{adminPassword}}\"\n}"
scripts:
  - type: afterResponse
    code: |-
      const respuesta = pm.response.json();
      pm.environment.set("authToken", respuesta.token);

      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("La respuesta incluye un token", function () {
          pm.expect(respuesta).to.have.property("token").that.is.a("string").and.not.empty;
      });
    language: text/javascript
order: 1789148400001
