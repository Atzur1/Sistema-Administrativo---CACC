$kind: http-request
description: "HU-029, requerimiento de solo lectura. Un PUT sobre el listado de deudores no debe modificar nada: la API debe responder 405 (método no permitido)."
url: "{{baseUrl}}/api/Pagos/player-accounts"
method: PUT
headers:
  - key: Authorization
    value: "Bearer {{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 405", function () {
          pm.response.to.have.status(405);
      });
    language: text/javascript
order: 1789148400011
